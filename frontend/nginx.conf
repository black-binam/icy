worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;
  gzip_min_length 1024;
  server_tokens off;

  # Limites de base
  client_max_body_size 5m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- En-têtes de sécurité ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- CSP (à activer / ajuster en prod) ----
    # add_header Content-Security-Policy
    #   "default-src 'self';
    #    script-src 'self';
    #    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    #    font-src 'self' https://fonts.gstatic.com;
    #    img-src 'self' data: https://*.tile.openstreetmap.org;
    #    connect-src 'self' https://api.icy.example.org;
    #    manifest-src 'self';
    #    worker-src 'self';
    #    frame-ancestors 'none';
    #    base-uri 'self';
    #    form-action 'self';" always;

    # ---- Cache assets fingerprintés ----
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    # Manifest et SW : pas de cache long
    location = /manifest.webmanifest {
      add_header Cache-Control "no-cache";
    }
    location = /sw.js {
      add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback ----
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Healthcheck
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
