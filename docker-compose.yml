services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: icy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icy_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-icy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icy} -d ${POSTGRES_DB:-icy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: icy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: icy-adminer
    restart: unless-stopped
    profiles: ["dev"]   # Only started with `docker compose --profile dev up`
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
