[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icy-backend"
version = "0.1.0"
description = "ICY — Healthcare Route Optimizer backend (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ICY Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "starlette>=0.37,<1.0",

    # Validation / settings
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "email-validator>=2.1,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",

    # Security
    "argon2-cffi>=23.1,<24.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "cryptography>=42.0,<44.0",

    # Rate limiting
    "slowapi>=0.1.9,<1.0",

    # HTTP client (for OSRM/ORS plugs)
    "httpx>=0.27,<1.0",

    # Optimization (reserved for solver agent)
    "ortools>=9.9,<10.0",

    # Redis / Celery (declared; wiring comes later)
    "redis>=5.0,<6.0",
    "celery>=5.4,<6.0",

    # Utils
    "python-multipart>=0.0.9,<1.0",
    "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "asgi-lifespan>=2.1,<3.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "types-python-jose>=3.3,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgis: tests requiring a real PostgreSQL+PostGIS instance (skipped by default)",
    "integration: integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101"] # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
